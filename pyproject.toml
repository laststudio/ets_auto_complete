[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-study-workflow-demo"
version = "0.3.0"
description = "Local homework, TTS, scoring, ISE, and mock-interface CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12.0",
  "edge-tts>=7.0.0",
  "websockets>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ets-demo = "ets_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
